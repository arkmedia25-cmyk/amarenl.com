name: AmareNL — YouTube Research Snapshot (wekelijks)

on:
  schedule:
    # 05:30 UTC ≈ 07:30 Amsterdam (zomertijd), zondag
    - cron: "30 5 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-and-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch YouTube research snapshot
        working-directory: tools/youtube-research
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node fetch.mjs

      - name: Commit snapshot (if changed)
        run: |
          git config user.name "AmareNL YouTube Research Bot"
          git config user.email "actions@github.com"
          git add tools/youtube-research/snapshot
          if git diff --cached --quiet; then
            echo "Geen wijziging in snapshot, commit overgeslagen."
          else
            git commit -m "chore: YouTube research snapshot bijwerken (wekelijks)"
            git push origin main
          fi
