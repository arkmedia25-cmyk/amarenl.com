name: AmareNL — Pinterest Kuyruğu (Faz 4)

on:
  schedule:
    # 07:00 UTC ≈ 09:00 Amsterdam (zomertijd), Pazartesi/Çarşamba/Cuma/Cumartesi
    - cron: "0 7 * * 1,3,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: amarenl-pinterest-queue
  cancel-in-progress: false

jobs:
  notify-next-pin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Send next queued pin to Telegram
        id: notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
        run: node scripts/pinterest-queue-notify.mjs

      - name: Commit queue status update
        if: steps.notify.outputs.changed == 'true'
        run: |
          git config user.name "AmareNL Pinterest Bot"
          git config user.email "actions@github.com"
          git add content/pinterest-queue.json
          git commit -m "pin: sıradaki pin Telegram'a gönderildi (onay bekliyor)"
          git push origin HEAD:main

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 KRİTİK: Pinterest kuyruğu workflow'"'"'u başarısız oldu (Faz 4).\n\n%s' "$RUN_URL")
          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
            --arg thread_id "${TELEGRAM_THREAD_ID:-}" \
            '{chat_id: $chat_id, text: $text} + (if $thread_id != "" then {message_thread_id: ($thread_id | tonumber)} else {} end)')
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "$RESPONSE"
          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id // empty')
          if [ -n "$MESSAGE_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/pinChatMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --argjson message_id "$MESSAGE_ID" '{chat_id: $chat_id, message_id: $message_id}')" \
              || echo "::warning::Mesaj pinlenemedi, ama bildirim gönderildi."
          fi
