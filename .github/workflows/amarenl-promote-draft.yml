name: AmareNL — Onaylanan Taslağı Yayınla

on:
  repository_dispatch:
    types: [promote-draft]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: amarenl-article-publish
  cancel-in-progress: false

jobs:
  merge-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync PR branch with main (auto-resolve known conflicts)
        id: sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          # Draft branches can sit open for days while main keeps moving (new
          # queue publishes + the Mon/Wed/Fri article cron both touch
          # data/extra-articles.json + public/sitemap.xml). Without this,
          # `gh pr merge` fails with "merge conflicts" for any PR approved
          # after main has moved past its base.
          BRANCH=$(gh pr view "$PR_NUMBER" --json headRefName -q .headRefName)
          git config user.name "AmareNL Article Bot"
          git config user.email "actions@github.com"
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          if git merge origin/main --no-edit; then
            echo "Branch already up to date or merged cleanly."
          else
            CONFLICTS=$(git diff --name-only --diff-filter=U)
            UNEXPECTED=$(echo "$CONFLICTS" | grep -vE '^(data/extra-articles\.json|public/sitemap\.xml)$' || true)
            if [ -n "$UNEXPECTED" ]; then
              echo "::error::Unexpected conflict outside the known-safe files: $UNEXPECTED"
              git merge --abort
              exit 1
            fi
            node scripts/resolve-article-conflict.mjs
            git checkout --theirs public/sitemap.xml
            git add data/extra-articles.json public/sitemap.xml
            jq . data/extra-articles.json > /dev/null
            git commit -m "queue: sync ${BRANCH} met main (auto-resolved article conflict)"
          fi

          git push origin "$BRANCH:$BRANCH"
          git checkout main

      - name: Wait for PR to become mergeable
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          for i in $(seq 1 15); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeable -q .mergeable)
            echo "mergeable=$STATE (attempt $i)"
            [ "$STATE" = "MERGEABLE" ] && exit 0
            sleep 3
          done
          echo "::error::PR #$PR_NUMBER never became mergeable (last state: $STATE)"
          exit 1

      - name: Merge approved PR
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          gh pr merge "$PR_NUMBER" --squash --delete-branch
          echo "Merged PR #$PR_NUMBER"

      - name: Pull merged main
        run: git pull origin main

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build (production sanity check)
        run: npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      - name: Notify Telegram (success)
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
        run: |
          TEXT=$(printf '✅ PR #%s canlıya alındı — https://amarenl.com' "$PR_NUMBER")
          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
            --arg thread_id "${TELEGRAM_THREAD_ID:-}" \
            '{chat_id: $chat_id, text: $text} + (if $thread_id != "" then {message_thread_id: ($thread_id | tonumber)} else {} end)')
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d "$PAYLOAD"

      - name: Notify Telegram (failure)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT=$(printf '🚨 KRİTİK: PR #%s onaylandı ama merge/build/deploy sırasında hata oluştu.\n\n%s' "$PR_NUMBER" "$RUN_URL")
          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
            --arg thread_id "${TELEGRAM_THREAD_ID:-}" \
            '{chat_id: $chat_id, text: $text} + (if $thread_id != "" then {message_thread_id: ($thread_id | tonumber)} else {} end)')
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d "$PAYLOAD")
          echo "$RESPONSE"
          MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.result.message_id // empty')
          if [ -n "$MESSAGE_ID" ]; then
            curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/pinChatMessage" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --argjson message_id "$MESSAGE_ID" '{chat_id: $chat_id, message_id: $message_id}')" \
              || echo "::warning::Mesaj pinlenemedi (bot izni olmayabilir), ama bildirim gönderildi."
          fi
