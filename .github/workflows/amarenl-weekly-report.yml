name: AmareNL — Haftalık Durum Özeti

on:
  schedule:
    # 06:00 UTC ≈ 08:00 Amsterdam (zomertijd), Pazartesi
    - cron: "0 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch GSC summary
        id: gsc
        env:
          GSC_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON_B64" ]; then
            echo "summary=GSC bağlı değil (secret eksik)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/gsc
          echo "$GSC_SERVICE_ACCOUNT_JSON_B64" | base64 -d > /tmp/gsc/service-account.json
          GSC_KEY_PATH=/tmp/gsc/service-account.json OUTPUT=$(node scripts/gsc-report.mjs summary 7 2>&1) || OUTPUT="GSC sorgusu başarısız: $OUTPUT"
          rm -f /tmp/gsc/service-account.json
          {
            echo "summary<<GSC_EOF"
            echo "$OUTPUT"
            echo "GSC_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch Meta Ads CPL summary
        id: metaads
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_ACCESS_TOKEN" ]; then
            echo "summary=Meta Ads niet gekoppeld (secret ontbreekt)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESPONSE=$(curl -sS "https://graph.facebook.com/v21.0/act_1523034172332806/insights?fields=spend,actions,impressions,clicks&date_preset=last_7d&access_token=${META_ACCESS_TOKEN}")
          OUTPUT=$(echo "$RESPONSE" | jq -r '
            if .error then "Meta API-fout: \(.error.message)"
            else
              (.data[0] // {}) as $d |
              (($d.spend // "0") | tonumber) as $spend |
              (($d.impressions // "0") | tonumber) as $impressions |
              (($d.clicks // "0") | tonumber) as $clicks |
              (($d.actions // []) | map(select(.action_type=="lead" or .action_type=="offsite_conversion.fb_pixel_lead")) | map(.value|tonumber) | add // 0) as $leads |
              "Spend: €\($spend) · Impressies: \($impressions) · Clicks: \($clicks) · Leads: \($leads)" +
              (if $leads > 0 then " · CPL: €\(($spend / $leads) * 100 | round / 100)" else " · CPL: n.v.t. (nog geen leads)" end)
            end
          ')
          {
            echo "summary<<META_EOF"
            echo "$OUTPUT"
            echo "META_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and send status summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          GSC_SUMMARY: ${{ steps.gsc.outputs.summary }}
          META_SUMMARY: ${{ steps.metaads.outputs.summary }}
        run: |
          runstatus() {
            # $1 = workflow file name
            gh run list --workflow="$1" --limit 1 --json conclusion,createdAt,status \
              --jq 'if length == 0 then "henüz hiç çalışmadı" else .[0] | (if .status != "completed" then "çalışıyor" elif .conclusion == "success" then "✅ başarılı (\(.createdAt))" else "❌ BAŞARISIZ (\(.createdAt))" end) end'
          }

          ARTICLE_STATUS=$(runstatus "amarenl-article-claude.yml")
          PINTEREST_STATUS=$(runstatus "amarenl-pinterest-queue.yml")
          DEPLOY_STATUS=$(runstatus "amarenl-promote-draft.yml")

          OPEN_PRS=$(gh pr list --state open --json number --jq 'length')

          if [ -f content/pinterest-queue.json ]; then
            QUEUE_SUMMARY=$(jq -r '
              group_by(.status) | map("\(.[0].status): \(length)") | join(", ")
            ' content/pinterest-queue.json)
          else
            QUEUE_SUMMARY="dosya bulunamadı"
          fi

          TEXT=$(printf '📊 Haftalık AmareNL Agency OS Durumu\n\n📝 Faz 2 (makale üretimi): %s\n📌 Faz 4 (Pinterest kuyruğu): %s\n🚀 Son deploy: %s\n\n📋 Telegram onay kuyruğunda bekleyen PR: %s\n📌 Pin kuyruğu durumu: %s\n\n💸 Faz 5 (Meta Ads, son 7 gün):\n%s\n\n🔎 GSC (son 7 gün):\n%s' \
            "$ARTICLE_STATUS" "$PINTEREST_STATUS" "$DEPLOY_STATUS" "$OPEN_PRS" "$QUEUE_SUMMARY" "$META_SUMMARY" "$GSC_SUMMARY")

          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$TEXT" \
            --arg thread_id "${TELEGRAM_THREAD_ID:-}" \
            '{chat_id: $chat_id, text: $text} + (if $thread_id != "" then {message_thread_id: ($thread_id | tonumber)} else {} end)')

          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" -d "$PAYLOAD"
